# Scheduled deep validation: the checks too slow for per-PR CI. Failing
# here means a soundness or storage-path regression reached main.
#
# - differential: Spark ground truth vs delta-explain's survivor set over
#   MinIO (the harness in examples/differential), fresh mode.
# - azurite-smoke: the az:// path end to end against the Azure emulator
#   (the automated version of the manual check that caught the az://
#   log-reader regression).
# - real-cloud-smoke: the same end-to-end read against real S3, Azure
#   Blob, and GCS demo tables. Emulators validate protocol semantics;
#   this leg validates what they cannot: real authentication, endpoints,
#   and regions (the class of the two 0.4.0 cloud bugs, which no emulator
#   caught). A leg skips itself when its secrets are not configured.
name: Validation

on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday morning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Start MinIO + Spark
        run: docker compose up -d
        working-directory: examples/differential

      # The checkout is owned by the runner user (uid 1001); the Spark
      # container writes ground_truth.json into the mounted work dir as
      # jovyan (uid 1000). Open it up or the harness dies on the write.
      - name: Make the shared work dir container-writable
        run: chmod 777 examples/differential/work

      - name: Run the differential harness (fresh mode)
        run: DX_BIN=$PWD/target/release/delta-explain DX_DIFF_FRESH=1 python3 examples/differential/run_differential.py

      # Dogfooding the report viewer: every validation run attaches a
      # self-rendering report.html for the table the harness just
      # exercised - this project as the viewer's first user, in exactly
      # the workflow it exists for (a pruning report on a CI run).
      - name: Render a report.html with the viewer
        run: |
          ./target/release/delta-explain s3://diff/users \
            --option aws_endpoint=http://localhost:9010 \
            --option aws_allow_http=true \
            --option aws_access_key_id=minioadmin \
            --option aws_secret_access_key=minioadmin \
            --option aws_virtual_hosted_style_request=false \
            --option aws_region=us-east-1 \
            -w "country LIKE '%E' AND age > 55" \
            --format json --verbose > report.json
          python3 - <<'EOF'
          tpl = open('viewer/report-viewer.html').read()
          doc = open('report.json').read().strip()
          open('report.html', 'w').write(tpl.replace('/*REPORT_JSON*/', doc, 1))
          EOF

      - name: Upload the rendered report
        uses: actions/upload-artifact@v7
        with:
          name: pruning-report
          path: report.html

  azurite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Start Azurite
        run: >
          docker run -d --name azurite -p 10000:10000
          mcr.microsoft.com/azure-storage/azurite
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

      - name: Install writer deps
        run: pip install --quiet deltalake pyarrow azure-storage-blob

      - name: Azurite smoke
        run: DX_BIN=$PWD/target/release/delta-explain python3 .github/scripts/azurite_smoke.py

  real-cloud-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cloud: s3
            uri_secret: CLOUD_SMOKE_S3_URI
          - cloud: az
            uri_secret: CLOUD_SMOKE_AZ_URI
          - cloud: gs
            uri_secret: CLOUD_SMOKE_GS_URI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Least privilege per leg: each cloud's credentials materialize only in
    # its own matrix leg (the conditional evaluates to '' elsewhere, and
    # each object_store backend drops option keys it does not know, so a
    # stray empty variable is inert). The GCS key is likewise written only
    # in the gs leg, in its own step below.
    env:
      TABLE_URI: ${{ secrets[matrix.uri_secret] }}
      AWS_ACCESS_KEY_ID: ${{ matrix.cloud == 's3' && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ matrix.cloud == 's3' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      AWS_REGION: ${{ matrix.cloud == 's3' && secrets.AWS_REGION || '' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ matrix.cloud == 'az' && secrets.AZURE_STORAGE_ACCOUNT_NAME || '' }}
      AZURE_STORAGE_ACCOUNT_KEY: ${{ matrix.cloud == 'az' && secrets.AZURE_STORAGE_ACCOUNT_KEY || '' }}
    steps:
      - name: Gate on configured credentials
        id: gate
        run: |
          if [ -n "$TABLE_URI" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no table URI configured for '${{ matrix.cloud }}', skipping"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: cargo build --release

      - name: Write the GCS service-account key
        if: steps.gate.outputs.run == 'true' && matrix.cloud == 'gs'
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/gcs-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcs-key.json" >> "$GITHUB_ENV"
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      # Two attempts: a transient cloud hiccup should not page anyone on a
      # Monday morning, a real regression fails twice.
      - name: Smoke against the real table
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          run_smoke() {
            ./target/release/delta-explain "$TABLE_URI" \
              -w "country = 'DE'" --env-creds --min-pruning 30 \
              --format json > report.json
            python3 - <<'PY'
          import json
          r = json.load(open("report.json"))
          assert r["schema_version"], "missing schema_version"
          assert r["stats"]["total_files"] > 0, "empty snapshot"
          assert r["analysis"]["partition_safe"] == "country = 'DE'", r["analysis"]
          assert r["result"] == "pass", f"gate failed: {r['assertions']}"
          print(f"ok: {r['stats']['total_files']} files, result {r['result']}")
          PY
          }
          run_smoke || { echo "first attempt failed, retrying once"; sleep 30; run_smoke; }
