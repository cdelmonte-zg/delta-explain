name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matrix:
    # We ship binaries for macOS and Windows; the tests must run where the
    # binaries do. Lints are platform-independent and run once, on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Run tests
        # --all-targets so example unit tests run too (e.g. gen_scale_log's
        # build_stats JSON guard), not just lib/bin/integration.
        run: cargo test --all-targets

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python wrapper tests (against the release binary)
        run: python python/tests/test_wrapper.py

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -- -D warnings

      # The debug-ir feature is off in every release artifact; this leg
      # keeps the gated code compiling and its tests green.
      - name: Tests and clippy with the debug-ir feature
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy --all-targets --features debug-ir -- -D warnings
          cargo test --features debug-ir

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -- --check

  # Branch protection requires a check literally named "test"; a matrix job
  # reports per-leg names, so this gate aggregates them under the required
  # name. It fails if any leg fails or is cancelled.
  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Gate
        run: test "${{ needs.test-matrix.result }}" = "success"

  # The wheel is the release surface Python users get: prove the whole
  # contract in PR CI, not just the module from source - maturin build,
  # clean-venv install, bundled-binary discovery, command and API both
  # working. One Linux wheel suffices; the platform matrix runs at release.
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: pipx run maturin build --release --out dist
      - name: Install in a clean venv and exercise the contract
        run: |
          python3 -m venv /tmp/dx-wheel
          /tmp/dx-wheel/bin/pip install --quiet dist/*.whl
          /tmp/dx-wheel/bin/delta-explain --version
          /tmp/dx-wheel/bin/python - <<'PY'
          import delta_explain
          print("bundled binary:", delta_explain.binary_path())
          r = delta_explain.explain("fixtures/test-table",
                                    where="country = 'DE' AND age > 40")
          assert r.total_files == 6 and r.final_files == 1 and r.passed
          r = delta_explain.explain("fixtures/test-table",
                                    where="country = 'DE'", min_pruning=99)
          assert not r.passed
          print("wheel contract: OK")
          PY

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2026-0194 / -0195: quick-xml DoS, patched in 0.41 which
      # object_store 0.13 does not accept yet (it pins 0.39). quick-xml
      # only parses XML responses from the user's own object store, so
      # exploitation requires a hostile storage endpoint. Tracked in a
      # repo issue; remove the ignores when object_store moves.
      - name: Audit
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t delta-explain .

      - name: Smoke test
        run: |
          docker run --rm -v ${{ github.workspace }}/fixtures/test-table:/data/test-table delta-explain \
            /data/test-table -w "age > 40 AND country = 'DE'" --format json
