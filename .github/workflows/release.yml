name: Release

on:
  push:
    tags: ["v*"]
  # Recovery path: rebuild and publish the wheels without re-tagging
  # (PyPI accepts additional files for an existing version). Only the
  # build-wheels and publish-pypi jobs run on dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings

  publish-crate:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    # Only publish stable releases (no prerelease tags like v0.1.0-alpha)
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    if: github.event_name == 'push'
    needs: [test, publish-crate]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  upload-binaries:
    needs: [test, github-release]
    if: github.event_name == 'push' && needs.test.result == 'success' && needs.github-release.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: delta-explain
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256

  build-deb:
    if: github.event_name == 'push'
    needs: [test, github-release]
    if: always() && needs.test.result == 'success' && needs.github-release.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation toolchain (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb --target ${{ matrix.target }}

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEB_FILE=$(find target/${{ matrix.target }}/debian -name "*.deb" | head -1)
          gh release upload ${{ github.ref_name }} "$DEB_FILE" --clobber

  build-wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # native arm64 runner: cross-compiling ring/aws-lc-sys fails,
          # and native means this wheel gets executed like the others
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel (CLI binary + Python wrapper)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      # Run the wheel we just built, on the platform it targets.
      - name: Install and exercise the wheel
        shell: bash
        run: |
          python3 -m venv wheel-venv
          if [ -e wheel-venv/bin/pip ]; then VENV=wheel-venv/bin; else VENV=wheel-venv/Scripts; fi
          "$VENV/pip" install --quiet dist/*.whl
          "$VENV/delta-explain" --version
          "$VENV/python" -c "import delta_explain; print(delta_explain.binary_path())"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing, no token secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  update-homebrew-tap:
    if: github.event_name == 'push'
    needs: [test, upload-binaries]
    runs-on: ubuntu-latest
    if: always() && needs.test.result == 'success' && needs.upload-binaries.result == 'success' && !contains(github.ref_name, '-')
    steps:
      - name: Update Homebrew tap formula
        env:
          VERSION_TAG: ${{ github.ref_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"

          declare -A SHA
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            URL="https://github.com/cdelmonte-zg/delta-explain/releases/download/${VERSION_TAG}/delta-explain-${target}.tar.gz"
            curl -fsSL -o /tmp/dx.tar.gz "$URL"
            SHA[$target]=$(sha256sum /tmp/dx.tar.gz | awk '{print $1}')
          done

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cdelmonte-zg/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula

          cat > Formula/delta-explain.rb <<EOF
          class DeltaExplain < Formula
            desc "Make Delta pruning visible: CLI for partition pruning and data skipping in Delta Lake"
            homepage "https://github.com/cdelmonte-zg/delta-explain"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/cdelmonte-zg/delta-explain/releases/download/${VERSION_TAG}/delta-explain-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA[aarch64-apple-darwin]}"
              end
              on_intel do
                url "https://github.com/cdelmonte-zg/delta-explain/releases/download/${VERSION_TAG}/delta-explain-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA[x86_64-apple-darwin]}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/cdelmonte-zg/delta-explain/releases/download/${VERSION_TAG}/delta-explain-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA[aarch64-unknown-linux-gnu]}"
              end
              on_intel do
                url "https://github.com/cdelmonte-zg/delta-explain/releases/download/${VERSION_TAG}/delta-explain-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA[x86_64-unknown-linux-gnu]}"
              end
            end

            def install
              bin.install "delta-explain"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/delta-explain --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/delta-explain.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
          else
            git commit -m "delta-explain ${VERSION}"
            git push
          fi

  update-scoop-bucket:
    if: github.event_name == 'push'
    needs: [test, upload-binaries]
    runs-on: ubuntu-latest
    if: always() && needs.test.result == 'success' && needs.upload-binaries.result == 'success' && !contains(github.ref_name, '-')
    steps:
      - name: Update Scoop bucket manifest
        env:
          VERSION_TAG: ${{ github.ref_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"

          URL="https://github.com/cdelmonte-zg/delta-explain/releases/download/${VERSION_TAG}/delta-explain-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o /tmp/dx.zip "$URL"
          HASH=$(sha256sum /tmp/dx.zip | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cdelmonte-zg/scoop-bucket.git" bucket
          cd bucket
          mkdir -p bucket

          cat > bucket/delta-explain.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Make Delta pruning visible: CLI for partition pruning and data skipping in Delta Lake.",
              "homepage": "https://github.com/cdelmonte-zg/delta-explain",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/cdelmonte-zg/delta-explain/releases/download/${VERSION_TAG}/delta-explain-x86_64-pc-windows-msvc.zip",
                      "hash": "${HASH}"
                  }
              },
              "bin": "delta-explain.exe",
              "checkver": {
                  "github": "https://github.com/cdelmonte-zg/delta-explain"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/cdelmonte-zg/delta-explain/releases/download/v\$version/delta-explain-x86_64-pc-windows-msvc.zip",
                          "hash": {
                              "url": "https://github.com/cdelmonte-zg/delta-explain/releases/download/v\$version/delta-explain-x86_64-pc-windows-msvc.sha256"
                          }
                      }
                  }
              }
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/delta-explain.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date"
          else
            git commit -m "delta-explain ${VERSION}"
            git push
          fi
