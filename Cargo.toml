[package]
name = "delta-explain"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Make Delta pruning visible. A CLI that shows step-by-step how partition pruning and data skipping reduce candidate files in a Delta table."
license = "MIT"
repository = "https://github.com/cdelmonte-zg/delta-explain"
homepage = "https://github.com/cdelmonte-zg/delta-explain"
documentation = "https://cdelmonte-zg.github.io/delta-explain/"
readme = "README.md"
keywords = ["delta-lake", "pruning", "data-skipping", "observability", "parquet"]
categories = ["command-line-utilities", "database"]
authors = ["Christian Del Monte"]

[dependencies]
delta_kernel = { version = "0.24", features = ["default-engine-rustls", "arrow"] }
clap = { version = "4", features = ["derive"] }
url = "2"
num-format = "0.4"
serde_json = "1"
object_store = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
sqlparser = "0.62"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# Compiles the --debug-ir diagnostic (dump of the pipeline's intermediate
# representations plus kernel trace capture) into the binary. Off by
# default: release artifacts ship without any debug machinery.
debug-ir = ["dep:tracing", "dep:tracing-subscriber"]

[dev-dependencies]
assert_cmd = "2"
jsonschema = { version = "0.48.1", default-features = false }
predicates = "3"
rstest = "0.26"
serde_json = "1"
tempfile = "3.27.0"

[package.metadata.deb]
maintainer = "Christian Del Monte <christian.del-monte@posteo.de>"
copyright = "2026, Christian Del Monte <christian.del-monte@posteo.de>"
license-file = ["LICENSE", "0"]
extended-description = """\
delta-explain is a CLI that shows how partition pruning and data skipping \
reduce the set of candidate files in a Delta Lake table, reading metadata \
directly via delta-kernel-rs without involving any query execution engine. \
Doubles as an assertion tool in CI/CD pipelines."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/delta-explain", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/delta-explain/README", "644"],
    ["LICENSE", "usr/share/doc/delta-explain/", "644"],
]
