name: "delta-explain"
description: >-
  Delta Lake pruning gate: fail CI when pruning falls below a threshold or
  files are missing statistics.
author: "Christian Del Monte"
branding:
  icon: "filter"
  color: "blue"

inputs:
  table:
    description: "Path or URI of the Delta table (local, s3://, az://, gs://)"
    required: true
  where:
    description: "SQL WHERE predicate to analyze"
    required: false
    default: ""
  min-pruning:
    description: "Fail if total pruning percentage is below this threshold"
    required: false
    default: ""
  assert-stats:
    description: "Fail if any file in the snapshot is missing statistics"
    required: false
    default: "false"
  at-version:
    description: "Analyze the table at this historical version"
    required: false
    default: ""
  options:
    description: "Object-store options, one KEY=VALUE per line"
    required: false
    default: ""
  env-creds:
    description: "Use the cloud provider's default credential chain"
    required: false
    default: "false"
  profile:
    description: "AWS profile from ~/.aws/credentials and ~/.aws/config"
    required: false
    default: ""
  version:
    description: "delta-explain release to install (e.g. 0.4.0), or 'latest'"
    required: false
    default: "latest"

outputs:
  pruning-pct:
    description: "Total pruning percentage reported by the analysis"
    value: ${{ steps.run.outputs.pruning-pct }}
  final-files:
    description: "Files surviving the predicate"
    value: ${{ steps.run.outputs.final-files }}
  result:
    description: "Overall assertion result: pass, fail, or null"
    value: ${{ steps.run.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Install delta-explain
      shell: bash
      env:
        DX_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION="$DX_VERSION"
        ASSET="delta-explain-x86_64-unknown-linux-gnu.tar.gz"
        # The latest/download shortcut avoids the API, which is rate-limited
        # for unauthenticated calls from shared runner IPs.
        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/cdelmonte-zg/delta-explain/releases/latest/download/${ASSET}"
        else
          URL="https://github.com/cdelmonte-zg/delta-explain/releases/download/v${VERSION#v}/${ASSET}"
        fi
        DEST="$RUNNER_TEMP/delta-explain-bin"
        mkdir -p "$DEST"
        curl -fsSL --retry 3 "$URL" | tar -xz -C "$DEST"
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Run delta-explain
      id: run
      shell: bash
      # Inputs come in through env, never interpolated into the script:
      # quotes, $(), or newlines in an input stay data instead of code.
      env:
        DX_TABLE: ${{ inputs.table }}
        DX_WHERE: ${{ inputs.where }}
        DX_MIN_PRUNING: ${{ inputs.min-pruning }}
        DX_ASSERT_STATS: ${{ inputs.assert-stats }}
        DX_AT_VERSION: ${{ inputs.at-version }}
        DX_ENV_CREDS: ${{ inputs.env-creds }}
        DX_PROFILE: ${{ inputs.profile }}
        DX_OPTIONS: ${{ inputs.options }}
      run: |
        set -uo pipefail
        args=("$DX_TABLE" --format json)
        [ -n "$DX_WHERE" ] && args+=(-w "$DX_WHERE")
        [ -n "$DX_MIN_PRUNING" ] && args+=(--min-pruning "$DX_MIN_PRUNING")
        [ "$DX_ASSERT_STATS" = "true" ] && args+=(--assert-stats)
        [ -n "$DX_AT_VERSION" ] && args+=(--at-version "$DX_AT_VERSION")
        [ "$DX_ENV_CREDS" = "true" ] && args+=(--env-creds)
        [ -n "$DX_PROFILE" ] && args+=(--profile "$DX_PROFILE")
        while IFS= read -r opt; do
          [ -n "$opt" ] && args+=(--option "$opt")
        done <<< "$DX_OPTIONS"

        set +e
        delta-explain "${args[@]}" | tee "$RUNNER_TEMP/dx-report.json"
        code=$?
        set -e

        report="$RUNNER_TEMP/dx-report.json"
        if [ -s "$report" ] && command -v jq >/dev/null; then
          {
            echo "pruning-pct=$(jq -r '.total_pruning_pct' "$report")"
            echo "final-files=$(jq -r '.final_files' "$report")"
            echo "result=$(jq -r '.result' "$report")"
          } >> "$GITHUB_OUTPUT"
        fi
        exit "$code"
