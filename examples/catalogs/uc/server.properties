# Unity Catalog OSS server configuration for the local catalog stack.
# Template: uc/bootstrap.sh appends the s3.* credentials to vend for the
# bucket and the result becomes /home/unitycatalog/etc/conf/server.properties
# in the unitycatalog/unitycatalog:v0.6.0 image; every other file in that
# directory is left as shipped.
server.env=dev
server.authorization=disable

# Classic MANAGED tables (no delta.feature.catalogManaged): the server only
# records the storage location; data is written by Spark through s3a.
server.managed-table.enabled=true
storage-root.tables=s3://cat/uc-managed

# The server never touches the bucket itself: for EXTERNAL tables it only
# records the location, and the credentials it vends (appended below at
# start) are RustFS's own temporary ones, since vending through STS has no
# endpoint setting for an S3-compatible store.
