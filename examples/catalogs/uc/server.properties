# Unity Catalog OSS server configuration for the local catalog stack.
# Mounted over /home/unitycatalog/etc/conf/server.properties in the
# unitycatalog/unitycatalog:v0.6.0 image; every other file in that
# directory is left as shipped.
server.env=dev
server.authorization=disable

# Classic MANAGED tables (no delta.feature.catalogManaged): the server only
# records the storage location; data is written by Spark through s3a.
server.managed-table.enabled=true
storage-root.tables=s3://cat/uc-managed

# No storage credentials: this stack exercises name resolution only. The
# server never touches the bucket for EXTERNAL tables, and credential
# vending has no MinIO endpoint support (s3.* config is AWS-only).
