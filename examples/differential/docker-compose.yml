# Differential-testing stack: MinIO (S3) + Spark, self-contained.
#
#   docker compose up -d          # or docker-compose up -d
#   python run_differential.py    # from the host, delta-explain on PATH
#
# Ports are offset from the demo stack (9010/9011/8890) so both can run.
version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: dxdiff-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - dxdiff-minio-data:/data
    networks: [dxdiff]

  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb -p local/diff &&
      echo 'bucket ready: diff'"
    networks: [dxdiff]

  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.1.2
    container_name: dxdiff-spark
    depends_on: [minio]
    ports:
      - "8890:8888"
    environment:
      JUPYTER_TOKEN: diff
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./work:/home/jovyan/work
    networks: [dxdiff]

networks:
  dxdiff:

volumes:
  dxdiff-minio-data:
