# Differential-testing stack: RustFS (S3) + Spark, self-contained.
#
#   docker compose up -d          # or docker-compose up -d
#   python run_differential.py    # from the host, delta-explain on PATH
#
# Ports are offset from the demo stack (9010/9011/8890) so both can run.
version: "3.8"

services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: dxdiff-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - dxdiff-rustfs-data:/data
    networks: [dxdiff]

  # one-shot: the server image ships curl, which signs the bucket PUT itself
  createbuckets:
    image: rustfs/rustfs:1.0.0
    depends_on: [rustfs]
    entrypoint: >
      /bin/sh -c "
      until curl -sf -o /dev/null http://rustfs:9000/health; do
        echo 'waiting for rustfs...'; sleep 1;
      done &&
      curl -sf -X PUT --user rustfsadmin:rustfsadmin
      --aws-sigv4 'aws:amz:us-east-1:s3' http://rustfs:9000/diff &&
      echo 'bucket ready: diff'"
    networks: [dxdiff]

  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.1.2
    container_name: dxdiff-spark
    depends_on: [rustfs]
    ports:
      - "8890:8888"
    environment:
      JUPYTER_TOKEN: diff
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      S3_ENDPOINT: http://rustfs:9000
    volumes:
      - ./work:/home/jovyan/work
    networks: [dxdiff]

networks:
  dxdiff:

volumes:
  dxdiff-rustfs-data:
