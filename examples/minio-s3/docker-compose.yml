# Minimal S3-compatible object store (MinIO) for trying delta-explain against
# s3:// storage. No Spark, no Jupyter - just somewhere to put Delta tables.
#
#   docker compose up -d           # or: docker-compose up -d
#   pip install -r requirements.txt
#   python write_tables.py
#   delta-explain s3://lake/users --option endpoint=http://localhost:9000 \
#       --option allow_http=true --option access_key_id=minioadmin \
#       --option secret_access_key=minioadmin \
#       --option virtual_hosted_style_request=false --region us-east-1 \
#       -w "country = 'DE' AND age > 55"
version: "3.8"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (minioadmin / minioadmin)

  # one-shot: wait for MinIO, then create the "lake" bucket
  createbucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb -p local/lake && echo 'bucket ready: lake'"

  # optional: write the tables from a notebook instead of host `write_tables.py`.
  # no Spark here -- delta-rs (deltalake) writes s3:// directly. Port 8889 keeps
  # it clear of the GCS example's Jupyter (8888), so both can run at once.
  jupyter:
    image: quay.io/jupyter/minimal-notebook:latest
    depends_on: [createbucket]
    ports:
      - "8889:8888"
    environment:
      JUPYTER_TOKEN: delta
      # inside the compose network MinIO is "minio", not localhost
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./:/home/jovyan/work
